id: inventory
name: Inventory (resale source of truth)
version: 0.16.3
description: >-
  Inventory for resellers who buy in lots and sell piece by piece. Tracks what you bought, what each
  box split into, which bin every piece is in, what it's worth (eBay sold comps, each price with its
  basis), where it's listed and what it sold for, with profit per lot and an audit trail of every
  change.

  The Inventory view gives you a work queue (to pack, listings to end, scans to check, ready to
  list, aging stock), phone-first box scanning with agent identification, QR labels for bins and
  items, label-first put-away with the camera, listing drafts you paste into eBay yourself, paste-a-
  sale, packing data, bin checks and a Copy list for group chats. It never posts, lists or messages
  anyone. Contributes agent tools for every operation, a bearer-gated JSON API under
  /api/plugins/inventory, and an optional weekly review. Ships DISABLED; enable it in Console →
  Plugins.
enabled: false
repository: https://github.com/protoLabsAI/inventory-plugin
min_protoagent_version: "0.148.0"   # sdk.plugin_store (the instance-scoped store) first shipped in 0.148

config_section: inventory
config:
  # Where the SQLite file lives. Blank = the host's instance-scoped plugin store
  # (<instance>/plugins-data/inventory/inventory.db) — the dev sandbox and every fleet
  # member get their own. Set only to point at an existing database.
  db_path: ""
  # Directory that relative paths in inventory_import_csv / inventory_export_csv resolve
  # against. Blank = the process working directory; set it to the agent workspace.
  workspace_dir: ""
  # ── Automations ── a plugin-owned recurring agent turn on the host scheduler (cancelled
  # when the plugin is disabled). The weekly review: re-prices stale evidence from eBay
  # sold comps (through the same tools, same rules), reports stale listings with a
  # recommendation (never changes a listing itself), and ends with the per-lot P&L.
  weekly_review: false
  weekly_review_cron: "0 9 * * 1"   # Monday 09:00 in review_timezone
  review_timezone: ""               # IANA name, e.g. America/Los_Angeles; blank = UTC
  review_max_items: 15              # re-price at most this many items per run (eBay pacing)
  stale_listing_days: 14            # a live listing older than this is reported
  stale_price_days: 30              # price evidence older than this is stale: re-checked by the review, badged in the view
  # ── Aging stock ── days an unsold item can sit (listed, or available and not listed) before Next
  # suggests a move: offer to watchers or drop 10%, then drop again or bundle, then decide.
  aging_days_1: 45
  aging_days_2: 90
  aging_days_3: 120
  # The address printed in bin-label QR codes, up to (not including) /plugins/inventory.
  # Blank = work it out: the agent's public URL (a fleet member's hub tenant path), else its console.
  label_base_url: ""
  # ── Scan intake ── the view uploads a photo; the plugin starts a cheap agent turn (its own
  # session per scan, never the operator's chat) that identifies it, and on request one that
  # prices the sell pile from eBay sold comps. A proposal below this confidence is shown as
  # "Not sure. Pick one or type it"; a turn that hasn't answered after the timeout shows as
  # failed with Retry (pricing gets three times as long).
  scan_confidence_threshold: 0.7
  scan_timeout_minutes: 10

# Console view (ADR 0026): a left-rail icon whose panel iframes the page this plugin
# serves at `path` (public prefix); its data comes through /api/plugins/inventory (gated).
views:
  - { id: inventory, label: "Inventory", icon: Boxes, path: /plugins/inventory/view }

# Bin-label hop (GET /plugins/inventory/b/<BIN>): the iPhone Camera app opens a printed QR with no
# bearer, so the host auth gate must exempt it. Only `views:` paths are auto-exempted; without this
# entry the route 401s on a token-gated host. It reads no data and answers the same for any valid id.
public_paths:
  - /plugins/inventory/b/
  # The item-label hop (0.10.0, GET /plugins/inventory/i/<ITEM>): same contract and same reason.
  - /plugins/inventory/i/
  # A printed-label sheet by its short-lived token (0.10.1, GET /plugins/inventory/sheet/<TOKEN>). The
  # desktop app hands the sheet's link to the system browser, which carries no bearer: the 32-byte
  # token (15 minutes) is the credential, and the sheet holds only what the printed labels show.
  - /plugins/inventory/sheet/

# Editable in Settings ▸ Plugins (ADR 0019).
settings:
  - { key: workspace_dir, label: "Workspace directory", type: path, path_kind: dir, description: "Relative paths given to inventory_import_csv / inventory_export_csv resolve here. Point it at the agent workspace." }
  - { key: weekly_review, label: "Weekly review", type: bool, description: "Arm a recurring agent turn that re-prices stale evidence from eBay sold comps, reports stale listings with a recommendation (it never changes a listing itself), and posts the per-lot P&L." }
  - { key: weekly_review_cron, label: "Weekly review cron", type: string, description: "5-field cron, evaluated in the review timezone. Default Monday 09:00." }
  - { key: review_timezone, label: "Review timezone", type: string, description: "IANA name such as America/Los_Angeles. Blank = UTC." }
  - { key: review_max_items, label: "Items re-priced per run", type: number, description: "Caps eBay searches per review run; the rest wait for the next one." }
  - { key: stale_listing_days, label: "Stale listing (days)", type: number, description: "A live listing older than this is reported in the review." }
  - { key: label_base_url, label: "Bin label address", type: string, description: "The address your phone opens when it scans a bin label, e.g. https://my-mac.tailnet.ts.net/agents/<agent-id>. Leave blank to use the agent's own public address." }
  - { key: scan_confidence_threshold, label: "Scan: sure enough at", type: number, description: "0 to 1. Below this, a scan asks you to pick from the agent's guesses or type the name instead of offering Looks right." }
  - { key: scan_timeout_minutes, label: "Scan: give up after (minutes)", type: number, description: "An identification that hasn't answered by then shows as failed, with Retry. Pricing gets three times as long." }
  - { key: stale_price_days, label: "Stale price (days)", type: number, description: "Price evidence older than this counts as stale: the weekly review re-checks it, and the view badges it and lists it under Housekeeping. 1 to 365." }
  - { key: aging_days_1, label: "Aging: first nudge (days)", type: number, description: "After this many days unsold, Next suggests an offer to watchers or a 10% drop. 1 to 730." }
  - { key: aging_days_2, label: "Aging: second nudge (days)", type: number, description: "After this many days, Next suggests another 10% drop or a bundle." }
  - { key: aging_days_3, label: "Aging: decide (days)", type: number, description: "After this many days, Next asks you to decide: clearance, bundle, or pull it." }

# Event bus (ADR 0039): the topics this plugin publishes.
emits:
  - { topic: inventory.item.changed, summary: "an item was created, updated, priced, listed or deleted ({id, action})" }
  - { topic: inventory.lot.changed, summary: "a lot was created, updated or deleted ({id})" }
  - { topic: inventory.sale.recorded, summary: "a sale was recorded ({item_id, sale_id, net, channel})" }
  - { topic: inventory.imported, summary: "a CSV was imported ({kind, created, updated})" }
  - { topic: inventory.bin.changed, summary: "bins were created, relabelled or deleted ({ids, action})" }
  - { topic: inventory.scan.changed, summary: "a scan was started, photographed, identified, confirmed, priced, binned or discarded ({id, state, action})" }
  - { topic: inventory.sale.packed, summary: "a sold item was picked and packed ({sale_id, item_id})" }
  - { topic: inventory.draft.changed, summary: "a listing draft was requested, written, copied, failed or marked live ({item_id, state, action})" }
  - { topic: inventory.paste.changed, summary: "a pasted sale was created, read, failed, recorded or discarded ({id, state, action})" }
  - { topic: inventory.packaging.changed, summary: "a packaging preset was created, updated or deleted ({id, action})" }
subscribes: []

capabilities:
  network: []
  filesystem: scoped   # its own SQLite file, scan photos beside it, + CSVs the operator names
